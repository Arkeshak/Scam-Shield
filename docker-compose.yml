version: "3.8"

services:
  scamshield:
    build: .
    container_name: scamshield
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_API_KEY=${MODEL_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - PORT=8000
    volumes:
      - ./data:/app/data
